<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Strømkart test</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    #map {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

<h1 style="position:fixed;top:10px;left:10px;z-index:99999;background:yellow;padding:10px;">
  TEST GIT 999
</h1>
  
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
  const map = L.map('map', {
    preferCanvas: true
  }).setView([63.5, 11], 5);

  setTimeout(() => {
    map.invalidateSize();
  }, 300);

  const markersLayer = L.layerGroup().addTo(map);

  const marker = L.circleMarker([59.91, 10.75], {
    radius: 10,
    color: 'blue',
    fillColor: 'blue',
    fillOpacity: 1,
    weight: 2
  });

  markersLayer.addLayer(marker);
</script>

</body>
</html>
