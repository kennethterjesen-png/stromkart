<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Strømkart</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />

  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      color: #222;
      background: #f3f4f6;
    }

    .app {
      display: flex;
      height: 100vh;
      width: 100%;
      overflow: hidden;
    }

    #sidebar {
      width: 420px;
      min-width: 420px;
      max-width: 420px;
      overflow-y: auto;
      padding: 12px;
      background: #f5f5f5;
      box-sizing: border-box;
      border-right: 1px solid #ddd;
    }

    #map {
      flex: 1;
      min-width: 0;
      height: 100vh;
      position: relative;
    }

    .panel {
      background: white;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .controls label {
      display: block;
      font-size: 14px;
      margin-bottom: 4px;
      margin-top: 8px;
      font-weight: 600;
    }

    .controls select,
    .controls button {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      margin-bottom: 6px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
    }

    .controls button {
      cursor: pointer;
      font-weight: 600;
    }

    .controls button:hover {
      background: #fafafa;
    }

    .checkbox-row {
      display: flex !important;
      align-items: center;
      gap: 8px;
      margin: 10px 0 8px 0 !important;
      font-weight: 600;
    }

    .checkbox-row input[type="checkbox"] {
      width: auto;
      margin: 0;
      padding: 0;
    }

    .status-line {
      font-size: 14px;
      color: #333;
      margin-top: 8px;
    }

    .filter-status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #b71c1c;
    }

    .filter-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #d32f2f;
      flex: 0 0 10px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .kpi {
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 10px;
    }

    .kpi-value {
      font-size: 22px;
      font-weight: bold;
      margin-top: 4px;
    }

    .outage-item,
    .provider-item,
    .top-item {
      padding: 10px;
      margin-bottom: 8px;
      background: white;
      cursor: pointer;
      border-radius: 8px;
      border-left: 6px solid #ccc;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .outage-item:hover,
    .provider-item:hover,
    .top-item:hover {
      background: #fafafa;
    }

    .outage-item {
      padding: 10px 12px;
    }

    .outage-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 6px;
    }

    .outage-company {
      font-weight: 700;
      font-size: 16px;
      line-height: 1.2;
    }

    .outage-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0 4px 0;
    }

    .outage-line {
      font-size: 14px;
      margin-top: 2px;
      color: #333;
    }

    .outage-description {
      margin-top: 6px;
      font-size: 12px;
      color: #666;
      line-height: 1.4;
    }

    .provider-ok {
      border-left-color: #2e7d32;
    }

    .provider-fail {
      border-left-color: #c62828;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 2px;
    }

    .badge-ok {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .badge-fail {
      background: #ffebee;
      color: #c62828;
    }

    .badge-type {
      margin-left: 0;
    }

    .badge-outage {
      background: #ffebee;
      color: #c62828;
    }

    .badge-planned {
      background: #fff3e0;
      color: #ef6c00;
    }

    .badge-customers {
      background: #eef2ff;
      color: #3949ab;
    }

    .badge-time {
      background: #f3e5f5;
      color: #7b1fa2;
    }

    .muted {
      color: #666;
      font-size: 13px;
    }

    .error-text {
      color: #b71c1c;
      font-size: 12px;
      margin-top: 4px;
      word-break: break-word;
    }

    .empty-state {
      background: white;
      border: 1px dashed #ccc;
      border-radius: 8px;
      padding: 14px;
      font-size: 14px;
      color: #555;
    }

    .popup-content {
      line-height: 1.4;
      min-width: 220px;
    }

    .popup-title {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 8px;
    }

    .popup-row {
      margin-bottom: 4px;
      font-size: 13px;
    }

    .popup-label {
      font-weight: 700;
    }

    .popup-description {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #eee;
      font-size: 13px;
      color: #444;
      white-space: normal;
    }

    .popup-link {
      margin-top: 10px;
      font-size: 13px;
    }

    .toggle-sidebar-btn {
      position: absolute;
      top: 80px;
      left: 12px;
      z-index: 1000;
      background: white;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .toggle-sidebar-btn:hover {
      background: #f5f5f5;
    }

    .sidebar-hidden #sidebar {
      display: none;
    }

    .sidebar-hidden #map {
      width: 100%;
    }

    h2, h3 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    @media (max-width: 900px) {
      .app {
        flex-direction: column;
      }

      #sidebar {
        width: 100%;
        min-width: 100%;
        max-width: 100%;
        height: 45vh;
        border-right: none;
        border-bottom: 1px solid #ddd;
      }

      #map {
        height: 55vh;
      }

      .sidebar-hidden #sidebar {
        display: none;
      }

      .sidebar-hidden #map {
        height: 100vh;
      }
    }
  </style>
</head>
<body>

<div class="app">
  <div id="sidebar">
    <h2>Strømbrudd</h2>

    <div class="panel">
      <h3>Oversikt</h3>
      <div class="kpi-grid">
        <div class="kpi">
          <div class="muted">Hendelser</div>
          <div class="kpi-value" id="kpiOutages">0</div>
        </div>
        <div class="kpi">
          <div class="muted">Berørte kunder</div>
          <div class="kpi-value" id="kpiCustomers">0</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <h3>Systemstatus</h3>
      <div class="status-line" id="stats">Laster...</div>
      <div class="status-line" id="lastUpdated"></div>
      <div class="status-line" id="relativeUpdated"></div>
      <div class="status-line" id="refreshStatus"></div>
      <div class="filter-status" id="filterActiveIndicator" style="display: none;">
        <span class="filter-dot"></span>
        <span>Filter aktivt</span>
      </div>
      <div class="status-line" id="activeFilters"></div>
    </div>

    <div class="panel controls">
      <h3>Min posisjon</h3>
      <button id="useMyLocationButton" type="button">Bruk min posisjon</button>
      <label for="radiusFilter">Radius</label>
      <select id="radiusFilter">
        <option value="10">10 km</option>
        <option value="20" selected>20 km</option>
        <option value="30">30 km</option>
      </select>
      <div class="status-line" id="locationStatus">Posisjon ikke valgt</div>
    </div>

    <div class="panel controls">
      <h3>Filtre</h3>

      <label for="companyFilter">Nettselskap</label>
      <select id="companyFilter">
        <option value="all">Alle</option>
      </select>

      <label for="typeFilter">Type</label>
      <select id="typeFilter">
        <option value="all">Alle</option>
        <option value="outage">Pågående</option>
        <option value="planned">Planlagt</option>
      </select>

      <label for="sortFilter">Sorter liste</label>
      <select id="sortFilter">
        <option value="customers_desc">Flest kunder først</option>
        <option value="customers_asc">Færrest kunder først</option>
        <option value="company_asc">Nettselskap A–Å</option>
        <option value="area_asc">Område A–Å</option>
      </select>

      <label for="hidePlannedFilter" class="checkbox-row">
        <input type="checkbox" id="hidePlannedFilter" />
        <span>Ikke vis planlagte brudd</span>
      </label>

      <button id="resetFilters" type="button">Nullstill filtre</button>
    </div>

    <div class="panel" style="display:none;">
  <h3>Providerstatus</h3>
  <div id="providerList"></div>
    </div>

    <div class="panel">
      <h3>Største hendelser</h3>
      <div id="topList"></div>
    </div>

    <div id="list"></div>
  </div>

  <div id="map">
    <button id="toggleSidebarButton" class="toggle-sidebar-btn" type="button">☰</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

<script>
  const STORAGE_KEY = 'strombruddFilters';

  const state = {
    outages: [],
    latestStatus: null,
    filters: {
      company: 'all',
      type: 'all',
      sort: 'customers_desc',
      hidePlanned: false
    },
    hasAutoFitRun: false,
    relativeUpdatedInterval: null,
    userLocation: null,
    radiusKm: 20,
    locationFilterEnabled: false
  };

  const markerMap = {};
  let userLocationMarker = null;
  let userLocationCircle = null;

  const map = L.map('map').setView([63.5, 11], 5);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd',
    maxZoom: 20,
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
  }).addTo(map);

  const markersLayer = L.markerClusterGroup({
    showCoverageOnHover: false,
    spiderfyOnMaxZoom: true,
    maxClusterRadius: 50
  });

  map.addLayer(markersLayer);

  const appContainer = document.querySelector('.app');
  const toggleSidebarButton = document.getElementById('toggleSidebarButton');

  const useMyLocationButton = document.getElementById('useMyLocationButton');
  const radiusFilter = document.getElementById('radiusFilter');
  const locationStatusDiv = document.getElementById('locationStatus');

  const companyFilter = document.getElementById('companyFilter');
  const typeFilter = document.getElementById('typeFilter');
  const sortFilter = document.getElementById('sortFilter');
  const hidePlannedFilter = document.getElementById('hidePlannedFilter');
  const resetFiltersButton = document.getElementById('resetFilters');

  const listDiv = document.getElementById('list');
  const statsDiv = document.getElementById('stats');
  const lastUpdatedDiv = document.getElementById('lastUpdated');
  const relativeUpdatedDiv = document.getElementById('relativeUpdated');
  const refreshStatusDiv = document.getElementById('refreshStatus');
  const activeFiltersDiv = document.getElementById('activeFilters');
  const filterActiveIndicator = document.getElementById('filterActiveIndicator');
  const providerListDiv = document.getElementById('providerList');
  const topListDiv = document.getElementById('topList');

  const kpiOutages = document.getElementById('kpiOutages');
  const kpiCustomers = document.getElementById('kpiCustomers');

  function formatDateTime(value) {
    if (!value) return '-';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return String(value);
    return date.toLocaleString('no-NO');
  }

  function formatNumber(value) {
    return Number(value || 0).toLocaleString('no-NO');
  }

  function safeText(value) {
    return value == null || value === '' ? '-' : String(value);
  }

  function formatTypeLabel(type) {
    return type === 'planned' ? 'Planlagt' : 'Pågående';
  }

  function getTypeBadgeClass(type) {
    return type === 'planned' ? 'badge-planned' : 'badge-outage';
  }

  function getDescriptionText(outage) {
    if (outage.raw && typeof outage.raw.description === 'string' && outage.raw.description.trim()) {
      return outage.raw.description.trim();
    }
    return '';
  }

  function getDescriptionSnippet(outage, maxLength = 160) {
    const description = getDescriptionText(outage);
    if (!description) return '';
    if (description.length <= maxLength) return description;
    return `${description.slice(0, maxLength)}...`;
  }

  function buildPopupHtml(outage) {
    const description = getDescriptionText(outage);
    const sourceLink =
      outage.sourceUrl && outage.sourceUrl !== '-'
        ? `<div class="popup-link"><a href="${safeText(outage.sourceUrl)}" target="_blank" rel="noopener noreferrer">Åpne kilde</a></div>`
        : '';

    return `
      <div class="popup-content">
        <div class="popup-title">${safeText(outage.company)}</div>
        <div class="popup-row"><span class="popup-label">Område:</span> ${safeText(outage.areaName)}</div>
        <div class="popup-row"><span class="popup-label">Type:</span> ${formatTypeLabel(outage.type)}</div>
        <div class="popup-row"><span class="popup-label">Berørte kunder:</span> ${formatNumber(outage.customers)}</div>
        <div class="popup-row"><span class="popup-label">Start:</span> ${safeText(outage.start)}</div>
        <div class="popup-row"><span class="popup-label">Slutt:</span> ${safeText(outage.end)}</div>
        ${description ? `<div class="popup-description">${safeText(description)}</div>` : ''}
        ${sourceLink}
      </div>
    `;
  }

  function getDistanceKm(lat1, lng1, lat2, lng2) {
    const toRad = (deg) => (deg * Math.PI) / 180;
    const R = 6371;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);

    const a =
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(toRad(lat1)) *
        Math.cos(toRad(lat2)) *
        Math.sin(dLng / 2) *
        Math.sin(dLng / 2);

    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  function renderUserLocation() {
    if (userLocationMarker) {
      map.removeLayer(userLocationMarker);
      userLocationMarker = null;
    }

    if (userLocationCircle) {
      map.removeLayer(userLocationCircle);
      userLocationCircle = null;
    }

    if (!state.locationFilterEnabled || !state.userLocation) return;

    const { lat, lng } = state.userLocation;
    const radiusMeters = state.radiusKm * 1000;

    userLocationMarker = L.circleMarker([lat, lng], {
      radius: 8,
      color: '#1565c0',
      fillColor: '#1565c0',
      fillOpacity: 1,
      weight: 2
    }).addTo(map);

    userLocationMarker.bindPopup('Din posisjon');

    userLocationCircle = L.circle([lat, lng], {
      radius: radiusMeters,
      color: '#1565c0',
      fillColor: '#1565c0',
      fillOpacity: 0.08,
      weight: 2
    }).addTo(map);
  }

  function useMyLocation() {
    if (!navigator.geolocation) {
      locationStatusDiv.textContent = 'Posisjon støttes ikke i denne nettleseren';
      return;
    }

    locationStatusDiv.textContent = 'Henter posisjon...';

    navigator.geolocation.getCurrentPosition(
      (position) => {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;

        state.userLocation = { lat, lng };
        state.locationFilterEnabled = true;
        state.radiusKm = Number(radiusFilter.value) || 20;

        locationStatusDiv.textContent = `Posisjon valgt (${state.radiusKm} km radius)`;
        renderUserLocation();
        map.setView([lat, lng], 10);
        render();
      },
      (error) => {
        locationStatusDiv.textContent = 'Kunne ikke hente posisjon';
        console.error('Geolocation-feil:', error);
      },
      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 60000
      }
    );
  }

  function loadSavedFilters() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;

    try {
      const parsed = JSON.parse(raw);
      state.filters.company = parsed.company || 'all';
      state.filters.type = parsed.type || 'all';
      state.filters.sort = parsed.sort || 'customers_desc';
      state.filters.hidePlanned = parsed.hidePlanned || false;
    } catch (error) {
      console.warn('Kunne ikke lese lagrede filtre:', error);
    }
  }

  function saveFilters() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.filters));
  }

  function applyFiltersToControls() {
    companyFilter.value = state.filters.company;
    typeFilter.value = state.filters.type;
    sortFilter.value = state.filters.sort;
    hidePlannedFilter.checked = state.filters.hidePlanned;
  }

  function populateCompanyFilter(outages) {
    const currentValue = state.filters.company || 'all';

    const companies = [...new Set(outages.map(o => o.company).filter(Boolean))].sort((a, b) =>
      String(a).localeCompare(String(b), 'no')
    );

    companyFilter.innerHTML = '<option value="all">Alle</option>';

    companies.forEach((company) => {
      const option = document.createElement('option');
      option.value = company;
      option.textContent = company;
      companyFilter.appendChild(option);
    });

    if (currentValue !== 'all' && companies.includes(currentValue)) {
      state.filters.company = currentValue;
    } else if (currentValue !== 'all') {
      state.filters.company = 'all';
      saveFilters();
    }

    companyFilter.value = state.filters.company;
  }

  function getFilteredOutages() {
    let result = [...state.outages];

    if (state.filters.company !== 'all') {
      result = result.filter((o) => o.company === state.filters.company);
    }

    if (state.filters.type !== 'all') {
      result = result.filter((o) => o.type === state.filters.type);
    }

    if (state.filters.hidePlanned) {
      result = result.filter((o) => o.type !== 'planned');
    }

    if (state.locationFilterEnabled && state.userLocation) {
      result = result.filter((o) => {
        const lat = Number(o.lat);
        const lng = Number(o.lng);
        if (!Number.isFinite(lat) || !Number.isFinite(lng)) return false;

        const distanceKm = getDistanceKm(
          state.userLocation.lat,
          state.userLocation.lng,
          lat,
          lng
        );

        return distanceKm <= state.radiusKm;
      });
    }

    switch (state.filters.sort) {
      case 'customers_asc':
        result.sort((a, b) => Number(a.customers || 0) - Number(b.customers || 0));
        break;
      case 'company_asc':
        result.sort((a, b) => String(a.company || '').localeCompare(String(b.company || ''), 'no'));
        break;
      case 'area_asc':
        result.sort((a, b) => String(a.areaName || '').localeCompare(String(b.areaName || ''), 'no'));
        break;
      case 'customers_desc':
      default:
        result.sort((a, b) => Number(b.customers || 0) - Number(a.customers || 0));
        break;
    }

    return result;
  }

  function renderActiveFilters() {
    const filters = [];

    if (state.filters.company !== 'all') filters.push(`Nettselskap: ${state.filters.company}`);
    if (state.filters.type !== 'all') filters.push(`Type: ${state.filters.type === 'planned' ? 'Planlagt' : 'Pågående'}`);
    if (state.filters.hidePlanned) filters.push('Skjul planlagte brudd');
    if (state.locationFilterEnabled && state.userLocation) filters.push(`Nær meg: ${state.radiusKm} km`);

    if (filters.length === 0) {
      filterActiveIndicator.style.display = 'none';
      activeFiltersDiv.textContent = '';
    } else {
      filterActiveIndicator.style.display = 'flex';
      activeFiltersDiv.textContent = `Filtrert på: ${filters.join(' | ')}`;
    }
  }

  function renderProviderStatus(providers) {
    providerListDiv.innerHTML = '';

    const sortedProviders = [...providers].sort((a, b) =>
      String(a.name || '').localeCompare(String(b.name || ''), 'no')
    );

    if (!sortedProviders.length) {
      providerListDiv.innerHTML = '';
      return;
    }

    sortedProviders.forEach((provider) => {
      const item = document.createElement('div');
      item.className = `provider-item ${provider.ok ? 'provider-ok' : 'provider-fail'}`;

      const safeName = provider.name || 'Ukjent';
      const safeCount = Number(provider.count || 0);
      const rawCount = Number(provider.rawCount || 0);
      const filteredOut = Number(provider.filteredOut || 0);

      let details = `${formatNumber(safeCount)} vist`;
      if (rawCount > 0) details += ` av ${formatNumber(rawCount)} hentet`;

      item.innerHTML = `
        <div><b>${safeName}</b></div>
        <div class="muted">${details}</div>
        ${filteredOut > 0 ? `<div class="muted">Filtrert bort: ${formatNumber(filteredOut)}</div>` : ''}
        <div class="badge ${provider.ok ? 'badge-ok' : 'badge-fail'}">
          ${provider.ok ? 'OK' : 'FEIL'}
        </div>
        ${provider.warning ? '<div class="error-text">Ingen brukbare hendelser etter filtrering</div>' : ''}
        ${provider.error ? `<div class="error-text">${provider.error}</div>` : ''}
      `;

      item.onclick = () => {
        state.filters.company = safeName;
        saveFilters();
        applyFiltersToControls();
        render();
      };

      providerListDiv.appendChild(item);
    });
  }

  function renderTopList(outages) {
    topListDiv.innerHTML = '';

    const topFive = [...outages]
      .sort((a, b) => Number(b.customers || 0) - Number(a.customers || 0))
      .slice(0, 5);

    if (!topFive.length) {
      topListDiv.innerHTML = '<div class="muted">Ingen hendelser</div>';
      return;
    }

    topFive.forEach((o) => {
      const item = document.createElement('div');
      item.className = 'top-item';
      item.style.borderLeftColor = o.type === 'planned' ? 'orange' : 'red';

      item.innerHTML = `
        <b>${safeText(o.company)}</b><br>
        <span class="muted">${safeText(o.areaName)}</span><br>
        ${formatNumber(o.customers)} kunder
      `;

      item.onclick = () => {
        const lat = Number(o.lat);
        const lng = Number(o.lng);

        if (Number.isFinite(lat) && Number.isFinite(lng)) {
          map.setView([lat, lng], 12);
          const marker = markerMap[o.id];
          if (marker) marker.openPopup();
        }
      };

      topListDiv.appendChild(item);
    });
  }

  function renderKPIs(filtered, all) {
    const totalCustomers = filtered.reduce((sum, o) => sum + Number(o.customers || 0), 0);
    kpiOutages.textContent = formatNumber(filtered.length);
    kpiCustomers.textContent = formatNumber(totalCustomers);
    statsDiv.textContent = `Viser ${filtered.length} av ${all.length} hendelser`;
  }

  function renderList(filtered) {
    listDiv.innerHTML = '';

    if (!filtered.length) {
      listDiv.innerHTML = '<div class="empty-state">Ingen hendelser matcher filtrene dine.</div>';
      return;
    }

    filtered.forEach((o) => {
      const lat = Number(o.lat);
      const lng = Number(o.lng);
      const color = o.type === 'planned' ? 'orange' : 'red';
      const descriptionSnippet = getDescriptionSnippet(o, 160);

      const item = document.createElement('div');
      item.className = 'outage-item';
      item.style.borderLeftColor = color;

      item.innerHTML = `
        <div class="outage-header">
          <div class="outage-company">${safeText(o.company)}</div>
          <span class="badge badge-type ${getTypeBadgeClass(o.type)}">${formatTypeLabel(o.type)}</span>
        </div>
        <div class="outage-line">${safeText(o.areaName)}</div>
        <div class="outage-meta">
          <span class="badge badge-customers">${formatNumber(o.customers)} kunder</span>
          <span class="badge badge-time">${safeText(o.start)}</span>
        </div>
        ${descriptionSnippet ? `<div class="outage-description">${safeText(descriptionSnippet)}</div>` : ''}
      `;

      item.onclick = () => {
        if (Number.isFinite(lat) && Number.isFinite(lng)) {
          map.setView([lat, lng], 12);
          const marker = markerMap[o.id];
          if (marker) marker.openPopup();
        }
      };

      listDiv.appendChild(item);
    });
  }

  function renderMap(filtered, options = {}) {
    const { autoFit = false } = options;

    markersLayer.clearLayers();
    Object.keys(markerMap).forEach((key) => delete markerMap[key]);

    const bounds = [];

    filtered.forEach((o) => {
      const lat = Number(o.lat);
      const lng = Number(o.lng);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;

      const color = o.type === 'planned' ? 'orange' : 'red';

      const marker = L.circleMarker([lat, lng], {
        radius: o.type === 'planned' ? 6 : 9,
        color,
        fillColor: color,
        fillOpacity: o.type === 'planned' ? 0.6 : 1,
        weight: 2
      });

      markerMap[o.id] = marker;
      marker.bindPopup(buildPopupHtml(o));
      markersLayer.addLayer(marker);
      bounds.push([lat, lng]);
    });

    if (autoFit && bounds.length > 0) {
      map.fitBounds(bounds, { padding: [40, 40] });
    }
  }

  function render(options = {}) {
    const filtered = getFilteredOutages();
    renderKPIs(filtered, state.outages);
    renderActiveFilters();
    renderTopList(filtered);
    renderList(filtered);
    renderMap(filtered, options);
    renderUserLocation();
  }

  function getRelativeTimeText(value) {
    if (!value) return 'Oppdatert tid: -';

    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return 'Oppdatert tid: -';

    const diffMs = Date.now() - date.getTime();
    const diffMinutes = Math.max(0, Math.floor(diffMs / 60000));

    if (diffMinutes < 1) return 'Oppdatert for mindre enn 1 min siden';
    if (diffMinutes === 1) return 'Oppdatert for 1 min siden';
    if (diffMinutes < 60) return `Oppdatert for ${diffMinutes} min siden`;

    const diffHours = Math.floor(diffMinutes / 60);
    if (diffHours === 1) return 'Oppdatert for 1 time siden';
    if (diffHours < 24) return `Oppdatert for ${diffHours} timer siden`;

    const diffDays = Math.floor(diffHours / 24);
    if (diffDays === 1) return 'Oppdatert for 1 dag siden';
    return `Oppdatert for ${diffDays} dager siden`;
  }

 function updateRelativeUpdated() {
  const timestamp = state.latestStatus?.updatedAt || null;
  relativeUpdatedDiv.textContent = getRelativeTimeText(timestamp);
}

  function startRelativeUpdatedTimer() {
    if (state.relativeUpdatedInterval) {
      clearInterval(state.relativeUpdatedInterval);
    }

    updateRelativeUpdated();

    state.relativeUpdatedInterval = setInterval(() => {
      updateRelativeUpdated();
    }, 60000);
  }

  async function loadStatus() {
    try {
      const response = await fetch('data/status.json');
      state.latestStatus = await response.json();

     if (state.latestStatus.updatedAt) {
  lastUpdatedDiv.textContent = `Sist oppdatert: ${formatDateTime(state.latestStatus.updatedAt)}`;
} else {
  lastUpdatedDiv.textContent = 'Sist oppdatert: -';
}

      updateRelativeUpdated();
      startRelativeUpdatedTimer();

      refreshStatusDiv.textContent = state.latestStatus.ok
  ? 'Siste oppdatering: OK'
  : 'Siste oppdatering: FEIL';

      renderProviderStatus([]);
    } catch (error) {
      state.latestStatus = null;
      lastUpdatedDiv.textContent = 'Sist oppdatert: -';
      relativeUpdatedDiv.textContent = 'Oppdatert tid: -';
      refreshStatusDiv.textContent = 'Siste oppdatering: FEIL';
      providerListDiv.innerHTML = '<div class="muted">Kunne ikke hente providerstatus</div>';
    }
  }

  async function loadData() {
    try {
      refreshStatusDiv.textContent = 'Oppdaterer data...';

      const response = await fetch('data/outages.json');
      const data = await response.json();

      if (Array.isArray(data)) {
        state.outages = data;
      } else if (Array.isArray(data.outages)) {
        state.outages = data.outages;
      } else {
        state.outages = [];
      }

      await loadStatus();

      populateCompanyFilter(state.outages);
      applyFiltersToControls();

      const shouldAutoFit = !state.hasAutoFitRun;
      render({ autoFit: shouldAutoFit });

      if (shouldAutoFit) {
        state.hasAutoFitRun = true;
      }
    } catch (error) {
      console.error('Feil ved henting av data:', error);
      state.outages = [];
      statsDiv.textContent = 'Kunne ikke hente data';
      listDiv.innerHTML = '<div class="empty-state">Kunne ikke hente strømbrudd akkurat nå.</div>';
      topListDiv.innerHTML = '<div class="muted">Ingen hendelser</div>';
      providerListDiv.innerHTML = '<div class="muted">Kunne ikke hente providerstatus</div>';
      markersLayer.clearLayers();
      refreshStatusDiv.textContent = 'Siste oppdatering: FEIL';
    }
  }

  function bindFilterControls() {
    if (toggleSidebarButton && appContainer) {
      toggleSidebarButton.addEventListener('click', () => {
        appContainer.classList.toggle('sidebar-hidden');
        setTimeout(() => {
          map.invalidateSize();
        }, 200);
      });
    }

    useMyLocationButton.addEventListener('click', () => {
      useMyLocation();
    });

    radiusFilter.addEventListener('change', () => {
      state.radiusKm = Number(radiusFilter.value) || 20;

      if (state.locationFilterEnabled && state.userLocation) {
        locationStatusDiv.textContent = `Posisjon valgt (${state.radiusKm} km radius)`;
        renderUserLocation();
        render();
      }
    });

    companyFilter.addEventListener('change', () => {
      state.filters.company = companyFilter.value;
      saveFilters();
      render();
    });

    typeFilter.addEventListener('change', () => {
      state.filters.type = typeFilter.value;
      saveFilters();
      render();
    });

    sortFilter.addEventListener('change', () => {
      state.filters.sort = sortFilter.value;
      saveFilters();
      render();
    });

    hidePlannedFilter.addEventListener('change', () => {
      state.filters.hidePlanned = hidePlannedFilter.checked;
      saveFilters();
      render();
    });

    resetFiltersButton.addEventListener('click', () => {
      state.filters = {
        company: 'all',
        type: 'all',
        sort: 'customers_desc',
        hidePlanned: false
      };

      state.userLocation = null;
      state.radiusKm = 20;
      state.locationFilterEnabled = false;
      radiusFilter.value = '20';
      locationStatusDiv.textContent = 'Posisjon ikke valgt';

      saveFilters();
      applyFiltersToControls();
      render({ autoFit: true });
      state.hasAutoFitRun = true;
    });
  }

  function init() {
    loadSavedFilters();
    bindFilterControls();
    loadData();
    setInterval(loadData, 60000);
  }

  init();
</script>

</body>
</html>
